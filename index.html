<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ByteFlow Login</title>

  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

  <div class="container">

    <div class="login-box fade">

      <!-- LOGO -->
      <div class="logo-box">
        BF
      </div>

      <!-- TITULO -->
      <h1 class="login-title">
        ByteFlow
      </h1>

      <p class="login-subtitle">
        Sistema de Produtividade Pessoal · Byte Force
      </p>

      <!-- CREDENCIAIS -->
      <div class="credentials-box">

        <span>
          👤 Usuário:
          <strong>admin</strong>
        </span>

        <span>
          🔑 Senha:
          <strong>123</strong>
        </span>

      </div>

      <!-- INPUT USER -->
      <div class="input-group">

        <label>USUÁRIO</label>

        <input
          type="text"
          id="username"
          placeholder="Digite seu usuário"
        >

      </div>
      <!-- INPUT PASSWORD -->
      <div class="input-group">

        <label>SENHA</label>

        <input
          type="password"
          id="password"
          placeholder="Digite sua senha"
        >

      </div>

      <!-- BUTTON -->
      <button id="loginBtn" class="login-button">
        Entrar no ByteFlow →
      </button>
